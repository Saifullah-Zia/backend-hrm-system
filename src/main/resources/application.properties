spring.application.name=hrm-system
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/hrm_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Mail - Namecheap Private Email (SSL on port 465)
# Mail - Namecheap Private Email (SSL on port 465)
# Mail - Namecheap Private Email (SSL on port 465)
spring.mail.host=mail.privateemail.com
spring.mail.port=465
spring.mail.username=hr@jcatsolutions.us
spring.mail.password=hr@jcatSolutions
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true


# JWT
jwt.secret=your-secret-key-here
jwt.expiration=86400000

# Jackson
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.serialization.fail-on-empty-beans=false