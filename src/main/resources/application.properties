spring.application.name=hrm-system

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hrm_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Email Configuration for privateemail.com (FIXED)
spring.mail.host=mail.privateemail.com
spring.mail.port=587
spring.mail.username=hr@jcatsolutions.us
spring.mail.password=hr@jcatSolutions

# Required properties
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# SMTP properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Debugging
spring.mail.properties.mail.debug=true

# Jackson configuration to handle null values
spring.jackson.deserialization.fail-on-null-for-primitives=false