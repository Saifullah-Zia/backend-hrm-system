
spring.application.name=hrm-system


# ?? Database ?????????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????????????????????
# Hibernate 7 (Spring Boot 4) auto-detects PostgreSQL ? do NOT specify dialect manually
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ?? Server ????????????????????????????????????????????????????????????????????
server.port=${PORT}

# ?? Error Handling ????????????????????????????????????????????????????????????
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ?? Mail ??????????????????????????????????????????????????????????????????????
spring.mail.host=mail.privateemail.com
spring.mail.port=587
spring.mail.username=hr@jcatsolutions.us
spring.mail.password=hr@jcatSolutions
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# ?? JWT ???????????????????????????????????????????????????????????????????????
# Set JWT_SECRET as an environment variable ? never hardcode in production.
# Must be at least 32 characters (256 bits) for HS256 signing.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ?? Jackson ???????????????????????????????????????????????????????????????????
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.serialization.fail-on-empty-beans=false

# ?? Multipart ?????????????????????????????????????????????????????????????????
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ?? Hikari Connection Pool (optimized for Railway) ????????????????????????????
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
# keepalive-time prevents Railway's network from dropping idle connections.
# Must be less than max-lifetime (1800000 ms). 60000 ms = 1 minute.
spring.datasource.hikari.keepalive-time=60000
# Validates the connection before handing it to the app.
spring.datasource.hikari.connection-test-query=SELECT 1